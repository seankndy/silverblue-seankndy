name: build

on:
  schedule:
    - cron: '0 6 * * *'   # nightly at 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: silverblue-seankndy
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Quay's CDN occasionally drops the base-image download mid-stream
      # (unexpected EOF). Pre-pull it with retries so a transient hiccup
      # doesn't fail the whole build; buildah then reuses it from local storage.
      - name: Pull base image (retry on transient registry errors)
        run: |
          BASE=$(awk '/^FROM/ {print $2; exit}' Containerfile)
          echo "Pulling $BASE"
          for i in 1 2 3 4 5; do
            podman pull "$BASE" && exit 0
            echo "::warning::pull of $BASE failed (attempt $i/5), retrying in 15s"
            sleep 15
          done
          echo "::error::pull of $BASE failed after 5 attempts"
          exit 1

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ github.sha }}
          containerfiles: ./Containerfile
          oci: true
          extra-args: |
            --pull=missing
            --cap-add=AUDIT_WRITE

      - name: Login to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}
