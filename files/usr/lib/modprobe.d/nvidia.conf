# Nvidia module options. Lives in /usr/lib/modprobe.d/ (not /etc/modprobe.d/)
# because /etc is per-machine on OSTree. Nouveau is blocked via kargs (see
# README), so the nouveau entries here are belt-and-suspenders only.
blacklist nouveau
options nouveau modeset=0
options nvidia-drm modeset=1 fbdev=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
